version: 2
project_name: mrimpact

before:
  hooks:
    - sh scripts/third-party-licenses.sh

builds:
  - main: ./cmd/mrimpact
    binary: mrimpact
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - third_party_licenses/**/*

checksum:
  name_template: checksums.txt

# Release notes come from the matching CHANGELOG.md section (release.yml
# passes --release-notes), not from commit messages.
changelog:
  disable: true

release:
  prerelease: auto
