name: Bug report
description: mrimpact failed, crashed or behaved differently from the reference.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a note that is wrong (a false positive or a false negative), use the "False positive / false negative" form instead.
        For a security vulnerability, do not open an issue: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `mrimpact --version`.
      placeholder: mrimpact v0.3.0
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version and OS
      description: The output of `go version`.
      placeholder: go version go1.26.0 linux/amd64
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command, or the workflow / CI job that runs it (GitHub Action, GitLab template, local).
      render: shell
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The error, the exit code, stderr.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Note excerpt
      description: The relevant part of the note (`mrimpact-report.md`), if one was written. Remove anything private.
      render: markdown
    validations:
      required: false
