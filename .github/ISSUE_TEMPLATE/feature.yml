name: Feature request
description: Suggest a new check, a note change or an integration.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        New checks must stay general Go, deterministic, offline, zero-config first and free of AI (see CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What a reviewer misses today, with an example change if you have one.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: What the note (or the tool) should do, and what it should look like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other tools or workarounds you considered.
    validations:
      required: false
